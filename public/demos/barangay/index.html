  <style>html{height:100%}body{margin:0;min-height:100%;background:#0d47a1}.center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}</style>
  <script>
    function removeSplashFromWeb() { document.getElementById("splash")?.remove(); document.body.style.background = "transparent"; }
    // Live updates (Supabase realtime) would dial the demo's fake backend address; answer them in the page instead.
    (function () {
      var Real = window.WebSocket;
      function Quiet(url, protocols) {
        if (String(url).indexOf('portfolio-demo.invalid') < 0) return protocols === undefined ? new Real(url) : new Real(url, protocols);
        this.url = String(url); this.readyState = 0; this.protocol = ''; this.extensions = ''; this.bufferedAmount = 0; this.binaryType = 'blob';
        this.onopen = this.onclose = this.onerror = this.onmessage = null;
      }
      Quiet.prototype.send = function () {};
      Quiet.prototype.close = function () { this.readyState = 3; };
      Quiet.prototype.addEventListener = function () {};
      Quiet.prototype.removeEventListener = function () {};
      Quiet.prototype.dispatchEvent = function () { return true; };
      ['CONNECTING', 'OPEN', 'CLOSING', 'CLOSED'].forEach(function (k, i) { Quiet[k] = i; Quiet.prototype[k] = i; });
      window.WebSocket = Quiet;
    })();

  </script>
</head>
